<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>借出中設備清單</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #fff; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .back-btn { padding: 8px 14px; font-size: 14px; font-weight: bold; background: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; }
    
    .loading { text-align: center; font-size: 16px; color: #666; margin-top: 30px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid #dee2e6; padding: 10px 8px; text-align: left; }
    th { background-color: #0d6efd; color: white; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    .badge-borrowed { background-color: #dc3545; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h3 style="margin:0;">📋 借出中設備清單</h3>
    <!-- 返回 Index 掃描主頁 -->
    <a id="go-scan-btn" class="back-btn" href="#">📷 返回掃描頁</a>
  </div>

  <div id="loading" class="loading">⏳ 正在載入借出中清單...</div>
  <div id="table-container"></div>

  <script>
    const API_URL = window.location.href.split('?')[0];
    document.getElementById('go-scan-btn').href = API_URL;

    window.onload = function() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(renderTable)
          .withFailureHandler(showError)
          .getBorrowedData();
      } else {
        document.getElementById('loading').innerText = "環境錯誤：非 GAS 環境執行。";
      }
    };

    function renderTable(data) {
      const loading = document.getElementById('loading');
      const container = document.getElementById('table-container');

      if (!data || data.length <= 1) {
        loading.innerText = "🎉 目前沒有借出中的設備！";
        return;
      }

      loading.style.display = 'none';

      let html = '<table><thead><tr>';
      data[0].forEach(header => {
        html += `<th>${header}</th>`;
      });
      html += '</tr></thead><tbody>';

      for (let i = 1; i < data.length; i++) {
        html += '<tr>';
        data[i].forEach((cell, index) => {
          if (index === 2) {
            html += `<td><span class="badge-borrowed">${cell}</span></td>`;
          } else {
            html += `<td>${cell}</td>`;
          }
        });
        html += '</tr>';
      }

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function showError(err) {
      document.getElementById('loading').innerText = "載入失敗：" + (err.message || err);
    }
  </script>
</body>
</html>
